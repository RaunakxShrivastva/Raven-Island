[package]
name = "raven-web"
version = "0.1.0"
edition = "2021"
description = "WebAssembly compilation target for Raven Slint UI"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.95"
slint = { version = "1.16.1", features = ["compat-1-2"] }
web-sys = { version = "0.3", features = ["console"] }

[build-dependencies]
slint-build = "1.16.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
