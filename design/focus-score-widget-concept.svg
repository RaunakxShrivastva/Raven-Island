    <rect x="36" y="30" width="252" height="4" rx="2" fill="#2A2C35"/>
    <rect x="36" y="30" width="185" height="4" rx="2" fill="#A855F7"/>
  </g>

  <g transform="translate(274 394)">
    <rect x="0" y="0" width="372" height="36" rx="10" fill="#FFFFFF" fill-opacity=".035"/>
    <circle cx="19" cy="18" r="5" fill="#22D3EE"/>
    <text x="36" y="24" class="font row-title">Study</text>
    <text x="302" y="24" class="font row-time">4h 10m</text>
    <rect x="36" y="30" width="252" height="4" rx="2" fill="#2A2C35"/>
    <rect x="36" y="30" width="123" height="4" rx="2" fill="#22D3EE"/>
  </g>

  <g transform="translate(274 438)">
    <rect x="0" y="0" width="372" height="36" rx="10" fill="#FFFFFF" fill-opacity=".03"/>
    <circle cx="19" cy="18" r="5" fill="#F59E0B"/>
