[package]
name = "Raven-Notch"
version = "0.1.5"
edition = "2021"
description = "Native-first Raven overlay migration shell"
authors = ["Raunak Shrivastava"]

[dependencies]
dirs = "6"
chrono = "0.4"
image = "0.24"
screenshots = "0.8.10"
base64 = "0.22"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.33"
thiserror = "2"
ureq = { version = "2", features = ["native-tls", "json"] }
regex = "1"
urlencoding = "2"
windows = { version = "0.52", features = [
    "implement",
    "Win32_Foundation",
    "Foundation_Numerics",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Media_Control",
    "Storage_Streams",
    "Foundation",
    "Foundation_Collections",
    "ApplicationModel",
    "UI_Notifications",
    "UI_Notifications_Management",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
] }
slint = { version = "=1.16.1", features = ["raw-window-handle-06"] }
raw-window-handle = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1

[build-dependencies]
slint-build = "=1.16.1"
winres = "0.1"
